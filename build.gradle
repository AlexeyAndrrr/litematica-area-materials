plugins {
    id 'fabric-loom' version '1.15.5'
}

version = project.mod_version
group = 'dev.areamaterials'
base { archivesName = 'litematica-area-materials-1.21.1' }

repositories {
    mavenCentral()
    maven { url = 'https://masa.dy.fi/maven/sakura-ryoko' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "fi.dy.masa.litematica:litematica-fabric-1.21:${project.litematica_version}"
    modImplementation "fi.dy.masa.malilib:malilib-fabric-1.21:${project.malilib_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
test { useJUnitPlatform() }
jar { from('LICENSE') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
